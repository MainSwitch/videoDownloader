version: "3.8"

services:
  n8n:
    build: .
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=https://d3c14d007fd4.ngrok-free.app
      - N8N_HOST=d3c14d007fd4.ngrok-free.app
      - N8N_PROTOCOL=https
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n

  downloader:
    build: ./downloader
    container_name: downloader
    ports:
      - "8080:8080"
volumes:
  n8n_data:
    external: true
